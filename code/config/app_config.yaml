# AWS Configuration
aws:
  region: !Parse ["os.environ.get('AWS_REGION_NAME')"]
  # DynamoDB
  dynamodb:
    call_records_table: !Parse ["os.environ.get('CALL_RECORDS_TABLE')"]

# Azure Configuration
azure:
  api_version: !Parse ["os.environ.get('AZURE_API_VERSION')"]
  api_key: !Parse ["os.environ.get('AZURE_ACCESS_KEY')"]
  api_base: !Parse ["os.environ.get('AZURE_API_BASE')"]
  openai:
    model_id: !Parse ["os.environ.get('AZURE_MODEL_ID')"]
    max_tokens: 3000
    temperature: 0.6

# Twilio Configuration
twilio:
  account_sid: !Parse ["os.environ.get('TWILIO_ACCOUNT_SID')"]
  auth_token: !Parse ["os.environ.get('TWILIO_AUTH_TOKEN')"]

# Ultravox Configuration
ultravox:
  api_key: !Parse ["os.environ.get('ULTROVOX_API_KEY')"]
  base_url: !Parse ["os.environ.get('ULTROVOX_BASE_URL')"]

# Notion Configuration
notion:
  token: !Parse ["os.environ.get('NOTION_API_TOKEN')"]
  journal_page_id: !Parse ["os.environ.get('NOTION_JOURNAL_PAGE_ID')"]
  todo_page_id: !Parse ["os.environ.get('NOTION_TODO_PAGE_ID')"]

prompts:
  todo_page: |
    You extract actionable tasks from transcripts.

    Context:
    - Today's date: <<today>>

    Output:
    Return EXACTLY one JSON object:
    {"tasks": ["<Group>: <concise one-line task> — due YYYY-MM-DD", "..."]}

    Rules:
    - No @mentions. If someone is clearly responsible, append Name in plain text (optional).
    - One line per task; imperative and specific; avoid fluff.
    - Break complex initiatives into a few grouped one-liners using a short group label before a colon, e.g., "Landing page: Draft wireframes".
    - Include only actionable next steps. Skip pure FYIs/decisions/questions with no next step.
    - Dates:
      - If a concrete or relative date is present, convert to an absolute date using {{today}} and append " — due YYYY-MM-DD".
      - If no clear date, omit the due part.
    - Deduplicate; keep the most specific version.
    - If nothing actionable, return {"tasks": []}.
    - Output must be valid JSON with double quotes. No prose, no extra keys.

    Transcript:
    <<<
    {{transcript}}
    >>>

  journal_page: |
    You are my daily journal ghostwriter.

    Context:
    - Today's date: <<today>>

    Goal:
    Write a natural first-person reflection answering “What happened today?” Use a grounded, human voice (no corporate tone).

    Output (return EXACTLY this shape and nothing else):
    {'journal': '<1-2 concise, descriptive paragraphs written as me, first-person. Use \n\n between paragraphs. Include concrete details (people, places, actions), at least one feeling word, and one small takeaway or intention for tomorrow. Keep it tight (≈100-300 words). Avoid lists, headings, emojis, and filler.>'}

    Rules:
    - Use past tense or present-progressive consistently.
    - Do not invent specifics that aren't in <<notes>>. If notes are sparse, stay general but honest (no fake names/places).
    - Keep it readable and conversational; cut adverbs and clichés.
    - Apostrophes inside the string: prefer the typographic apostrophe ('). If you must use ASCII ' inside text, escape it as \'.
    - Do not output markdown or extra keys; return exactly one Python-dict style object with single quotes as shown.
